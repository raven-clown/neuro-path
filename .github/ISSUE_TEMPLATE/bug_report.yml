name: Bug report
description: Something in the pane is broken or wrong
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. The more exact the steps, the faster it gets fixed.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the pane with /neuro
        2. Run ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
      placeholder: 2.1.286
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Neuro Path version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where does it happen
      options:
        - Desktop app
        - Terminal
        - VS Code
        - Mobile
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: A screenshot of the pane, or lines starting with `neuro-path:` from `claude --debug`.
