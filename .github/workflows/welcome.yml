name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue here. If it is about a step landing in the wrong stage, the exact command or tool call helps the most.
          pr-message: |
            Thanks for your first pull request. The checks below run on every PR: plugin validation, a changelog entry for plugin changes, a title check and CodeQL. A maintainer will review it soon.
